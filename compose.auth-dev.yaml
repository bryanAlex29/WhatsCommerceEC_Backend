name: whatscommerceec-auth-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?admin profile required}
      POSTGRES_DB: ${POSTGRES_DB:?admin profile required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?admin profile required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  auth_postgres_data:
    name: whatscommerceec-auth-dev_postgres_data
